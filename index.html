    if(i>=items.length){const c=mk("div","card");c.append(mk("div","big",right+" / "+items.length),mk("p","mu","Số câu đúng ngay lần đầu chọn."));const b=mk("button","pri","Học lại từ đầu");b.onclick=go;c.appendChild(b);box.appendChild(c);return}
    const it=items[i],c=mk("div","card");let locked=false;
    c.appendChild(mk("div","mu","Câu "+(i+1)+"/"+items.length));
    c.appendChild(mk("div","q",it.q));
    const bs=it.o.map((o,k)=>{const b=mk("button","opt",L[k]+". "+o.t);b.onclick=()=>{if(locked)return;locked=true;if(o.c)right++;bs.forEach((x,j)=>{if(it.o[j].c)x.classList.add("ok");else if(x===b)x.classList.add("no")});nx.style.display=""};c.appendChild(b);return b});
    const nx=mk("button","pri",i+1<items.length?"Câu tiếp →":"Xem kết quả");nx.style.display="none";nx.onclick=()=>{i++;show()};
    c.appendChild(nx);box.appendChild(c);
  }
  show();
}
function test(){
  const c=mk("div","card");
  c.appendChild(mk("div","q","Chọn số câu cho đề thi"));
  const s=document.createElement("select");[20,30,40,Q.length].forEach(n=>{const o=mk("option","",n===Q.length?"Tất cả ("+n+" câu)":n+" câu");o.value=n;s.appendChild(o)});
  const b=mk("button","pri","Bắt đầu");b.style.marginTop="12px";b.onclick=()=>run(+s.value);
  c.append(s,b);app.appendChild(c);
}
function run(n){
  app.innerHTML="";
  const items=sh(Q).slice(0,n).map(prep);const sel=new Array(n).fill(-1);
  items.forEach((it,i)=>{
    const c=mk("div","card");c.appendChild(mk("div","q",(i+1)+". "+it.q));
    const bs=it.o.map((o,k)=>{const b=mk("button","opt",L[k]+". "+o.t);b.onclick=()=>{sel[i]=k;bs.forEach(x=>x.classList.remove("on"));b.classList.add("on")};c.appendChild(b);return b});
    it.bs=bs;it.c=c;app.appendChild(c);
  });
  const sub=mk("button","pri","Nộp bài");
  sub.onclick=()=>{
    let r=0;
    items.forEach((it,i)=>{it.bs.forEach((b,k)=>{b.onclick=null;b.classList.remove("on");if(it.o[k].c)b.classList.add("ok");else if(sel[i]===k)b.classList.add("no")});if(sel[i]>=0&&it.o[sel[i]].c)r++});
    sub.remove();
    const res=mk("div","card");
    res.append(mk("div","big",(r/n*10).toFixed(2)+" / 10"),mk("p","mu","Đúng "+r+"/"+n+" câu. Câu xanh là đáp án đúng, câu đỏ là lựa chọn sai của bạn."));
    const again=mk("button","pri","Làm đề mới");again.onclick=go;res.appendChild(again);
    app.prepend(res);window.scrollTo(0,0);
  };
  app.appendChild(sub);
}
function list(){
  const f=document.createElement("input");f.placeholder="Tìm câu hỏi hoặc đáp án…";app.appendChild(f);
  f.style.marginBottom="12px";
  const box=mk("div");app.appendChild(box);
  function draw(){
    box.innerHTML="";const k=f.value.trim().toLowerCase();
    Q.forEach((q,i)=>{
      if(k&&!(q.q+" "+q.o.join(" ")).toLowerCase().includes(k))return;
      const c=mk("div","card");c.appendChild(mk("div","q",(i+1)+". "+q.q));
      q.o.forEach((t,j)=>c.appendChild(mk("div",j===0?"opt ok":"mu",(j===0?"✓ ":"• ")+t)));
      box.appendChild(c);
    });
  }
  f.oninput=draw;draw();
}
go();
</script>
