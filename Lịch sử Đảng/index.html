Việt Nam"],"a":3,"g":0},{"n":216,"c":2,"q":"Bổ sung cụm từ còn thiếu vào chỗ trống. Hội nghị Trung ương lần thứ 11 và 12 (1965) nêu lên tư tưởng chỉ đạo và phương châm đấu tranh ở miền Nam “Giữ vững và phát triển thế……, kiên quyết……và liên tục……, đánh địch trên cả ba vùng chiến lược”.","o":["tấn công/tiến công/ tiến công","tiến công/phản công /tiến công","tấn công/tấn công /tấn công","tiến công/tiến công /tiến công"],"a":3,"g":0},{"n":217,"c":2,"q":"Trong Chính cương của Đảng Lao động Việt Nam xác định con đường đi lên chủ nghĩa xã hội trải qua 4 giai đoạn, đó là những giai đoạn nào?","o":["Hoàn thành giải phóng dân tộc; Tiến hành cải cách ruộng đất; Hoàn chỉnh chế độ dân chủ nhân dân; Tiến tới xây dựng chủ nghĩa xã hội","Hoàn chỉnh chế độ dân chủ nhân dân; Tiến hành cải cách ruộng đất; Tiến tới xây dựng chủ nghĩa xã hội; Hoàn thành giải phóng dân tộc","Tiến hành cải cách ruộng đất; Hoàn chỉnh chế độ dân chủ nhân dân; Tiến tới xây dựng chủ nghĩa xã hội; Hoàn thành giải phóng dân tộc","Tiến tới xây dựng chủ nghĩa xã hội; Hoàn thành giải phóng dân tộc; Tiến hành cải cách ruộng đất; Hoàn chỉnh chế độ dân chủ nhân dân"],"a":0,"g":0},{"n":218,"c":2,"q":"Chọn phương án trả lời chưa chính xác Nguyên nhân nào khiến Pháp và Tưởng bắt tay nhau và ký bản hiệp ước Hoa - Pháp (28/2/1946):","o":["Tưởng muốn rút quân về nước để đối phó với nội chiến trong nước","Pháp muốn kéo quân ra Bắc thay thế 20 vạn quân Tưởng","Pháp muốn kết thúc chiến tranh một cách nhanh chóng","Pháp và Tưởng đang cần hợp tác để đối phó với 1 kẻ thù chung"],"a":3,"g":0},{"n":219,"c":2,"q":"Vai trò của Bảo Đại đối với chế độ Ngụy quyền ở miền Nam trong thời kỳ đầu là:","o":["Tổng thống","Quốc trưởng","Cố vấn","Thủ tướng"],"a":1,"g":0},{"n":220,"c":2,"q":"Vai trò quyết định nhất của hậu phương Miền Bắc trong cuộc kháng chiến chống đế quốc Mỹ được thể hiện:","o":["Cơ quan đầu não, bộ chỉ huy ở đó và là hậu phương cho cả 2 miền","Trực tiếp tiến hành cuộc cách mạng, làm hậu phương cho miền Nam","Củng cố xây dựng lực lượng để viện trợ cho miền Nam","Là hậu phương chiến lược, trực tiếp chiến đấu cùng miền Nam"],"a":0,"g":0},{"n":221,"c":2,"q":"Theo điều khoản của Hiệp định Giơnevơ (21/7/1954), Việt Nam bị chia cắt làm 2 miền và vĩ tuyến 17 đóng vai trò là gì?","o":["Giới tuyến chiến sự","Giới tuyến chiến lược","Giới tuyến quân sự","Giới tuyến quan trọng"],"a":2,"g":0},{"n":222,"c":2,"q":"Luận điểm nào dưới đây thể hiện đúng và đầy đủ nhất về đường lối kháng chiến chống Mỹ cứu nước của Đảng?","o":["Thể hiện quyết tâm đánh và thắng đế quốc Mỹ xâm lược, nắm vững và giương cao ngọn cờ độc lập dân tộc và chủ nghĩa xã hội kết hợp chặt chẽ hai chiến lược cách mạng trong hoàn cảnh cả nước có chiến tranh","Kiên định tư tưởng chiến lược tiến công, tinh thần độc lập tự chủ kết hợp chặt chẽ hai chiến lược cách mạng trong hoàn cảnh đất nước được phát triển trong hoàn cảnh mới","Nắm vững và giương cao ngọn cờ độc lập dân tộc và chủ nghĩa xã hội, tiến hành đồng thời và kết hợp chặt chẽ hai chiến lược cách mạng trong hoàn cảnh cả nước có chiến tranh ở mức độ khác nhau, phù hợp với thực tế đất nước và bối cảnh quốc tế","Chiến lược chiến tranh nhân dân, toàn dân, toàn diện, lâu dài, dựa vào sức mình là chính được phát triển trong hoàn cảnh mới"],"a":2,"g":0},{"n":223,"c":2,"q":"Chọn đáp án trả lời không chính xác. Nguyên nhân dẫn đến thắng lợi của cuộc kháng chiến chống Mỹ cứu nước:","o":["Sự ủng hộ hết lòng và giúp đỡ to lớn của các nước ASEAN","Sự lãnh đạo đúng đắn của Đảng Cộng sản Việt Nam","Miền Bắc hoàn thành xuất sắc nghĩa vụ của hậu phương lớn","Tinh thần đoàn kết, sự gian khổ hi sinh của nhân dân và quân đội cả nước"],"a":0,"g":0},{"n":224,"c":2,"q":"Sắp xếp các sự kiện sau theo trình tự mốc thời gian: 1. Hiệp định Sơ bộ - 2. Bản Tạm ước Việt Pháp - 3. Pháp nổ súng xâm lược Nam Bộ - 4. Hiệp ước Hoa - Pháp.","o":["1 - 2 – 3 - 4","3 - 4 -1 - 2","2 - 3 – 4 - 1","4 – 3 – 2 - 1"],"a":1,"g":1},{"n":225,"c":2,"q":"Ba mũi giáp công được Đảng xác định trong kháng chiến chống Mỹ:","o":["Chính trị, quân sự, văn hoá","Kinh tế, chính trị, binh vận","Chính trị, quân sự, binh vận","Kinh tế, chính trị, ngoại giao"],"a":2,"g":0},{"n":226,"c":2,"q":"Ngày 6/4/1975 ai là người đã ra mệnh lệnh “Thần tốc, thần tốc hơn nữa, táo bạo, táo bạo hơn nữa, sốc tới chiến trường giải phóng miền Nam, quyết chiến và toàn thắng”?","o":["Phạm Hùng","Võ Nguyên Giáp","Lê Duẩn","Trần Phú"],"a":1,"g":0},{"n":227,"c":2,"q":"Câu nói: “Chiến tranh có thể kéo dài 5 năm, 10 năm, 20 năm hoặc lâu hơn nữa. Hà Nội, Hải Phòng và một số thành phố, xí nghiệp có thể bị tàn phá, song nhân dân Việt Nam quyết không sợ. Không có gì quý hơn độc lập, tự do” là của ai, được nói vào thời gian nào?","o":["Võ Nguyên Giáp, 6/965","Trường Chinh, 7/1967","Hồ Chí Minh, 7/1966","Lê Duẩn, 7/1976"],"a":2,"g":0},{"n":228,"c":2,"q":"Chiến lược tìm mọi cách thỏa hiệp với Trung Quốc, hòa hoãn với Liên Xô hòng cắt giảm nguồn viện trợ chủ yếu của Việt Nam (còn gọi là chiến lược ngoại giao tam giác), được Mỹ sử dụng ở giai đoạn nào trong cuộc chiến tranh xâm lược Việt Nam?","o":["1965 - 1968","1969 - 1970","1969 - 1973","1973 - 1975"],"a":2,"g":0},{"n":229,"c":2,"q":"Giai đoạn 1945 - 1946 đã để lại cho Đảng và cách mạng Việt Nam nhiều bài học kinh nghiệm quý báu. Bài học kinh nghiệm nào sau đây không thuộc thời kỳ này?","o":["Phát huy tinh thần cách mạng tiến công, kết hợp chiến tranh du kích với chiến tranh chính quy, đánh địch trên cả ba vùng chiến lược","Triệt để lợi dụng mâu thuẫn trong nội bộ kẻ thù, chĩa mũi nhọn vào kẻ thù chính, coi sự nhân nhượng có nguyên tắc với kẻ địch cũng là một biện pháp đấu tranh cách mạng cần thiết trong hoàn cảnh cụ thể","Phát huy sức mạnh đại đoàn kết dân tộc, dựa vào dân để xây dựng và bảo vệ chính quyền cách mạng","Tận dụng khả năng hòa hoãn để xây dựng lực lượng, củng cố chính quyền nhân dân, đồng thời đề cao cảnh giác, sẵn sàng ứng phó với khả năng chiến tranh lan ra cả nước khi kẻ địch bội ước"],"a":0,"g":1},{"n":230,"c":2,"q":"Chọn phương án trả lời không chính xác. Nguyên nhân nào sau đây dẫn đến sự thắng lợi của cuộc kháng chiến chống đế quốc Mỹ?","o":["Sự lãnh đạo đúng đắn của Đảng","Sự anh dũng chiến đấu của cả dân tộc","Đoàn kết giữa ba dân tộc anh em (Việt – Lào – Campuchia)","Nhờ sự giúp đỡ chủ yếu của Liên Xô và các nước ASEAN"],"a":3,"g":0},{"n":231,"c":2,"q":"Điểm giống nhau của ba chiến lược chiến tranh: đặc biệt, cục bộ và Việt Nam hóa mà đế quốc Mỹ thực hiện ở Việt Nam là:","o":["Quân đội Mỹ và quân đội Sài Gòn mở rộng chiến tranh","Chiến tranh xâm lược thực dân kiểu mới","Sử dụng quân Mỹ và đồng minh của Mỹ","Có cố vấn Mỹ chỉ huy, tranh thủ ngoại giao với Liên Xô và Trung Quốc"],"a":1,"g":0},{"n":232,"c":2,"q":"Chọn phương án trả lời không chính xác. Trong nhận định của Đảng về nhiệm vụ và mối quan hệ giữa cách mạng hai miền Nam Bắc giai đoạn 1954 - 1975?","o":["Miền Nam là tiền tuyến lớn và Miền Bắc là hậu phương, cũng là tiền tuyến lớn, có vai trò quyết định đến sự thống nhất của Tổ quốc","Miền Bắc là hậu phương lớn, quyết định nhất còn Miền Nam là tiền tuyến lớn, quyết định trực tiếp đến sự thống nhất Tổ quốc","Miền Bắc là hậu phương lớn, Miền Nam là tiền tuyến lớn, cách mạng cả 2 miền đều có vai trò quyết định đến sự thống nhất Tổ quốc","Miền Bắc là hậu phương lớn, Miền Nam là tiền tuyến lớn, cách mạng cả 2 miền đều có vai trò quan trọng đến sự thống nhất Tổ quốc"],"a":0,"g":0},{"n":234,"c":2,"q":"“Trong 10 năm qua, miền Bắc đã tiến những bước dài trong lịch sử. Đất nước và con người đều đổi mới”, đó là nhận định của Chủ tịch Hồ Chí Minh khi nói về thời kỳ nào của đất nước?","o":["1945 - 1954","1955 - 1965","1961 - 1971","1960 - 1970"],"a":1,"g":0},{"n":235,"c":2,"q":"Chủ trương “tiến nhanh, tiến mạnh, tiến vững chắc lên CNXH” được Đảng đưa ra ở Đại hội lần thứ mấy?","o":["Đại hội I (1935)","Đại hội II (1951)","Đại hội III (1960)","Đại hội IV (1976)"],"a":3,"g":1},{"n":236,"c":2,"q":"Trong kháng chiến chống thực dân Pháp (1946 – 1954) lực lượng vũ trang của ta bao gồm:","o":["Bộ đội chủ lực chuyên nghiệp địa phương, quân du kích","Bộ đội chủ lực, bộ đội địa phương và dân quân du kích","Bộ đội chủ lực, bộ đội tinh nhuệ, và quân đội tại chỗ","Bộ đội chủ lực, dân quân du kích"],"a":1,"g":0},{"n":237,"c":2,"q":"Trong đường lối kháng chiến chống thực dân Pháp, Đảng đã xác định triển vọng của cuộc kháng chiến là:","o":["Mặc dù lâu dài, gian khổ, khó khăn, song nhất định thắng lợi","Sẵn sàng đàm phán nếu Pháp công nhận Việt Nam độc lập","Thực hiện thêm bạn bớt thù","Biểu dương thực lực"],"a":0,"g":0},{"n":238,"c":2,"q":"Thuật ngữ “cách mạng dân tộc dân chủ nhân dân” được sử dụng nhằm đề cập đến giai đoạn nào của đất nước?","o":["1930 - 1945","1960 - 1975","1954 - 1975","1945 - 1975"],"a":3,"g":1},{"n":239,"c":3,"q":"Năm 2003, Ban Bí thư đã ban hành Chỉ thị số 23-CT/TW về:","o":["Đẩy mạnh nghiên cứu, tuyên truyền, giáo dục tư tưởng Hồ Chí Minh","Học tập làm theo phong cách Hồ Chí Minh","Học tập và làm theo đạo đức Hồ Chí Minh","Vận động học tập và làm theo tấm gương Hồ Chủ tịch"],"a":0,"g":0},{"n":240,"c":3,"q":"Hội nghị Hiệp thương chính trị của hai đoàn đại biểu Bắc - Nam để thống nhất Tổ quốc (từ 15 - 21/11/1975) đã họp tại:","o":["Sài Gòn","Cần Thơ","Huế","Đà Nẵng"],"a":0,"g":0},{"n":241,"c":3,"q":"Ngày 25/4/1976, đã diễn ra sự kiện:","o":["Cuộc tổng tuyển cử bầu Quốc hội chung","Hiệp thương dân chủ","Họp Đại hội Đảng lần thứ IV","Họp Đại hội Đảng lần thứ V"],"a":0,"g":0},{"n":242,"c":3,"q":"Tháng 7/1976, kỳ họp thứ nhất của Quốc hội nước Việt Nam thống nhất quyết định bầu ai làm Chủ tịch nước?","o":["Tôn Đức Thắng","Lê Duẩn","Võ Nguyên Giáp","Phạm Văn Đồng"],"a":0,"g":0},{"n":243,"c":3,"q":"Đại hội lần thứ IV của Đảng (1976) đã quyết định đổi tên từ Đảng Lao động Việt Nam thành:","o":["Đảng Cộng sản Đông Dương","An Nam Cộng sản Đảng","Đảng Cộng sản Việt Nam","Đông Dương Cộng sản Đảng"],"a":2,"g":0},{"n":244,"c":3,"q":"Đại hội lần thứ IV của Đảng (1976) đã bầu ai làm Tổng Bí thư?","o":["Tôn Đức Thắng","Trường Chinh","Võ Nguyên Giáp","Lê Duẩn"],"a":3,"g":0},{"n":245,"c":3,"q":"Chọn phương án trả lời đúng. Một trong năm bài học được Đảng đưa ra trong Cương lĩnh xây dựng đất nước thời kỳ quá độ lên chủ nghĩa xã hội (1991):","o":["Đổi mới trên một số lĩnh vực được xác định là thế mạnh của đất nước","Phát triển nền kinh tế thị trường định hướng XHCN","Giữ vững định hướng xã hội chủ nghĩa trong quá trình đổi mới","Phải có tổng kết và đưa ra bài học kinh nghiệm cho giai đoạn phát triển tiếp theo"],"a":2,"g":0},{"n":246,"c":3,"q":"Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội được Đảng thông qua tại Đại hội nào?","o":["Đại hội VI (1986)","Đại hội VII (1991)","Đại hội VIII (1996)","Đại hội IX (2001)"],"a":1,"g":0},{"n":247,"c":3,"q":"Nội dung: “Đảng Cộng sản Việt Nam là sản phẩm của sự kết hợp chủ nghĩa Mác-Lênin với phong trào công nhân và phong trào yêu nước của nhân dân Việt Nam”, được khẳng định tại:","o":["Đại hội VI (1986)","Đại hội VII (1991)","Đại hội VIII (1996)","Đại hội IX (2001)"],"a":1,"g":0},{"n":248,"c":3,"q":"Việt Nam - Trung Quốc đã bình thường hóa quan hệ, từng bước khôi phục và mở rộng quan hệ hữu nghị, hợp tác nhiều mặt vào thời gian nào?","o":["1988","1989","1990","1991"],"a":3,"g":0},{"n":249,"c":3,"q":"Chọn phương án trả lời đúng. Chủ trương xây dựng phát triển văn hoá và giải quyết các vấn đề xã hội thời kỳ 2011 - 2015, được Đảng xác định:","o":["Xây dựng phát triển văn hoá con người Việt Nam đáp ứng nhu cầu phát triển bền vững đất nước","Phát triển khoa học v đoàn kết của một dân tộc luôn khát khao độc lập"],"a":2,"g":0},{"n":307,"c":3,"q":"Thành công mà Việt Nam có được trong năm 1995 trên lĩnh vực ngoại giao là:","o":["Được các nước ở Phương Tây đặt quan hệ ngoại giao, kết nghĩa anh em và hỗ trợ về kinh tế","Trở thành thành viên của ASEAN, Mỹ bỏ cẩm vận, được các nước ở Châu Âu đặt quan hệ ngoại giao","Mở rộng quan hệ ngoại giao với tất cả các nước trên thế giới, mở ra thời kỳ đỉnh cao về ngoại giao","Trở thành thành viên của ASEAN, ký kết hợp tác trên mọi mặt, đặc biệt là kinh tế với Trung Quốc"],"a":1,"g":0},{"n":308,"c":3,"q":"Nghị quyết Trung ương 5 khoá VIII đã nhấn mạnh tính chất của văn hoá Việt Nam là:","o":["Hoà bình, độc lập, dân chủ tiến bộ","Tiên tiến, đậm đà bản sắc dân tộc","Kế thừa truyền thống văn hoá","Văn hoá là linh hồn của dân tộc"],"a":1,"g":0},{"n":309,"c":3,"q":"Đại hội Đảng lần thứ VI (12/1986) được đánh giá là Đại hội của sự nghiệp đổi mới đất nước, trong đó trọng tâm của đổi mới là:","o":["Đổi mới về công nghiệp hoá","Đổi mới về văn hoá","Đổi mới về xã hội mới","Đổi mới về tư duy kinh tế"],"a":3,"g":0},{"n":310,"c":3,"q":"Nội dung nào dưới đây không phản ánh đúng quyết định của Đại hội Đảng toàn quốc lần thứ V (3/1982)?","o":["Cả nước tiến nhanh, tiến mạnh, tiến vững chắc lên chủ nghĩa xã hội","Tiếp tục đường lối xây dựng chủ nghĩa xã hội trong phạm vi cả nước","Thời kỳ quá độ lên chủ nghĩa xã hội ở nước ta phải trải qua nhiều chặng","Phương hướng, nhiệm vụ, mục tiêu của kế hoạch 5 năm (1981 - 1985)"],"a":0,"g":0},{"n":311,"c":3,"q":"Xuất phát từ bài học kinh nghiệm trong giai đoạn 2011 – 2015, Đảng nhận định cần “Nhìn thẳng vào sự thật, đánh giá đúng sự thật, nói rõ sự thật, bám sát thực tiễn đất nước và thế giới”. Kinh nghiệm này được đưa ra từ Đại hội nào của Đảng?","o":["Đại hội lần thứ X","Đại hội lần thứ VIII","Đại hội lần thứ XI","Đại hội lần thứ XII"],"a":3,"g":0},{"n":312,"c":3,"q":"Đại hội XII (2016) của Đảng xác định: giữ vai trò động lực quan trọng của nền kinh tế thị trường định hướng xã hội chủ nghĩa ở nước ta, đó là thành phần kinh tế:","o":["Kinh tế tập thể","Kinh tế tư nhân","Kinh tế nhà nước","Kinh tế có vốn đầu tư nước ngoài"],"a":1,"g":0},{"n":313,"c":3,"q":"Sau khi miền Bắc được giải phóng, Trung ương Đảng đã chủ trương chuyển miền Bắc sang giai đoạn mới với nhận thức là:","o":["Sự kết thúc cách mạng dân tộc dân chủ nhân dân cũng là sự mở đầu của cách mạng xã hội chủ nghĩa như các Cương lĩnh của Đảng đã xác định","Là sự mở đầu của cách mạng xã hội chủ nghĩa và cách mạng xã hội chủ nghĩa như các Cương lĩnh của Đảng đã xác định","Là sự kết thúc cách mạng dân tộc dân chủ nhân dân cách mạng xã hội chủ nghĩa như các Cương lĩnh của Đảng đã xác định","Tiến hành cách mạng dân tộc dân chủ nhân dân cách mạng xã hội chủ nghĩa như các Cương lĩnh của Đảng đã xác định"],"a":0,"g":0},{"n":314,"c":3,"q":"Đại hội Đảng lần thứ XII (2016) đã xác định: “Đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước, chú trọng công nghiệp hóa, hiện đại hóa nông nghiệp, nông thôn gắn với …….”.","o":["Xây dựng nông thôn mới","Xây dựng con người mới","Phát triển kinh tế thị trường","Phát triển kinh tế mới"],"a":0,"g":0},{"n":315,"c":3,"q":"Đại hội XII (2016) của Đảng đã xác định thành phần kinh tế được khuyến khích phát triển, đó là:","o":["Kinh tế tập thể","Kinh tế tư nhân","Kinh tế nhà nước","Kinh tế có vốn đầu tư nước ngoài"],"a":1,"g":0},{"n":316,"c":3,"q":"Bổ sung cụm từ còn thiếu vào chỗ trống. Cương lĩnh bổ sung, phát triển năm 2011 đã xác định: “Mục tiêu tổng quát khi kết thúc……. ở nước ta là xây dựng được về cơ bản nền tảng kinh tế của chủ nghĩa xã hội với ….. về chính trị, tư tưởng, văn hoá phù hợp, tạo cơ sở để nước ta trở thành một nước xã hội chủ nghĩa ngày càng phồn vinh, hạnh phúc”","o":["thời kỳ quá độ/ kiến trúc thượng tầng","kỷ nguyên cũ/ phát triển","kiến trúc thượng tầng/ thời kỳ quá độ","phát triển/ kỷ nguyên cũ"],"a":0,"g":0},{"n":317,"c":3,"q":"Chỉ thị số 100-CT/TW về khoán sản phẩm đến nhóm và người lao động trong các hợp tác xã nông nghiệp được ban hành vào thời gian nào?","o":["1945","1981","2000","2020"],"a":1,"g":0},{"n":318,"c":3,"q":"Đại hội Đại biểu toàn quốc lần thứ VII (1991) của Đảng khẳng định:","o":["Chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh là nền tảng tư tưởng, kim chỉ nam cho mọi hành động của Đảng","Chủ nghĩa Mác - Lênin với và phong trào yêu nước của nhân dân Việt Nam là kim chỉ nam của Đảng","Tư tưởng Hồ Chí Minh với Chủ nghĩa Mác - Lênin và tinh thần đại đoàn kết của dân dân là trọng tâm của cách mạng Việt Nam","Chủ nghĩa Mác - Lênin và phong trào nông nhân và phong trào yêu nước là yếu tố quyết định cách mạng"],"a":0,"g":0},{"n":320,"c":3,"q":"Đại hội lần thứ IV (1976) của Đảng đã xác định đường lối chung của cách mạng xã hội chủ nghĩa trong giai đoạn mới ở nước ta là tiến hành đồng thời các cuộc cách mạng:","o":["Cách mạng quan hệ sản xuất – cách mạng khoa học kỹ thuật – cách mạng tư tưởng và văn hóa","Cách mạng giáo dục – cách mạng khoa học kỹ thuật – cách mạng tư tưởng và văn hóa","Cách mạng quan hệ sản xuất – cách mạng văn hóa – cách mạng tư tưởng","Cách mạng quan hệ sản xuất – cách mạng giáo dục – cách mạng tư tưởng và văn hóa"],"a":0,"g":0},{"n":321,"c":3,"q":"Bốn bài học quý giá được Đại hội VI (1986) của Đảng rút ra bốn bài học quý giá, cụ thể:","o":["Đảng phải quán triệt tư tưởng “lấy dân làm gốc”; Phải biết kết hợp sức mạnh dân tộc với sức mạnh thời đại trong điều kiện mới; Chăm lo xây dựng Đảng ngang tầm với một đảng cầm quyền lãnh đạo nhân dân tiến hành cách mạng xã hội chủ nghĩa.","Đảng phải quán triệt tư tưởng “lấy dân làm gốc”; Đảng phải luôn luôn xuất phát từ thực tế, tôn trọng và hành động theo quy luật khách quan; Chăm lo xây dựng Đảng ngang tầm với một đảng cầm quyền lãnh đạo nhân dân tiến hành cách mạng xã hội chủ nghĩa.","Đảng phải quán triệt tư tưởng “lấy dân làm gốc”; Đảng phải luôn luôn xuất phát từ thực tế, tôn trọng và hành động theo quy luật khách quan; Phải biết kết hợp sức mạnh dân tộc với sức mạnh thời đại trong điều kiện mới;","Đảng phải quán triệt tư tưởng “lấy dân làm gốc”; Đảng phải luôn luôn xuất phát từ thực tế, tôn trọng và hành động theo quy luật khách quan; Biết kết hợp sức mạnh dân tộc với sức mạnh thời đại; Chăm lo xây dựng Đảng ngang tầm với một đảng cầm quyền."],"a":3,"g":0},{"n":322,"c":3,"q":"Đặc trưng tổng quát về mục tiêu xây dựng chủ nghĩa xã hội ở Việt Nam là: “Dân giàu, nước mạnh, xã hội công bằng, văn minh” được bổ sung ở kỳ Đại hội Đảng lần thứ mấy?","o":["Đại hội lần thứ V (1982)","Đại hội lần thứ VI (1986)","Đại hội lần thứ VII (1991)","Đại hội lần thứ VIII (1996)"],"a":3,"g":0},{"n":323,"c":3,"q":"Đại hội Đại biểu toàn quốc lần thứ IX (2001) của Đảng đã xác định: Động lực chủ yếu để phát triển đất nước là đại đoàn kết toàn dân trên cơ sở liên minh giữa công nhân với nông dân và trí thức do Đảng lãnh đạo, kết hợp hài hòa các lợi ích……., tập thể và ……., phát huy mọi tiềm năng và nguồn lực của các thành phần kinh tế, của toàn xã hội","o":["xã hội/cá nhân","tập thể/ riêng lẻ","cá nhân/ xã hội","riêng lẻ/ tập thể"],"a":2,"g":0},{"n":324,"c":3,"q":"Bổ sung những cụm từ còn thiếu vào chỗ trống. Chủ đề của Đại hội lần thứ XII được Đảng đưa ra là: “Tăng cường xây dựng Đảng …… vững mạnh; phát huy sức mạnh toàn dân tộc và …… xã hội chủ nghĩa; đẩy mạnh toàn diện, đồng bộ công cuộc đổi mới; bảo vệ vững chắc Tổ quốc, giữ vững môi trường …... ổn định; phấn đấu sớm đưa nước ta cơ bản trở thành nước…… theo hướng hiện đại”?","o":["cầm quyền/ định hướng/ chính trị/ phát triển","trong sạch/ dân chủ / hòa bình/ công nghiệp","trong sạch/ hòa bình/ chính trị/ phát triển","trong sạch/ dân chủ/ công nghiệp/ hòa bình"],"a":1,"g":0},{"n":325,"c":3,"q":"Bổ sung những cụm từ còn thiếu. Đại hội XI (2011) của Đảng định hướng: \"Phát triển kinh tế là nhiệm vụ ……, thực hiện công nghiệp hóa, hiện địa hóa đất nước gắn với phát triển .….. bảo vệ tài nguyên môi trường\"","o":["trọng tâm/ kinh tế hàng hoá","trung tâm/ kinh tế tri thức","chính/ kinh tế nhiều thành phần","trọng điểm/ kinh tế thị trường đinh hướng XHCN"],"a":1,"g":0},{"n":326,"c":3,"q":"Lựa chọn phương án trả lời đúng nhất. Hội nghị Trung ương 3 khóa X đã ban hành Nghị quyết số 04/NQ/TW (21/08/2006) về tăng cường sự lãnh đạo của Đảng đối với công tác:","o":["Đấu tranh chống phong trào suy thoái đạo đức","Đấu tranh chống tự diễn biến, tự chuyển hóa trong đảng viên","Đấu tranh phòng, chống tham nhũng, lãng phí","Đấu tranh phòng chống tệ nạn xã hội"],"a":2,"g":0},{"n":327,"c":3,"q":"Tháng 11/2006, Bộ Chính trị đã ban hành Chỉ thị 06 - CT/TW về tổ chức vận động:","o":["Học tập và làm theo tư tưởng đạo đức Hồ Chí Minh","Học tập và làm theo tấm gương đạo đức Hồ Chí Minh","Học tập theo phong cách đạo đức Hồ Chí Minh","Làm theo tấm gương đạo đức và phong cách Hồ Chí Minh"],"a":1,"g":0},{"n":328,"c":3,"q":"Chọn phương án trả lời chưa chính xác. Hội nghị Trung ương lần thứ 4 khóa XI đã ban hành \"Chiến lược biển Việt Nam đến năm 2020\" trong đó khẳng định:","o":["Phát triển kinh tế phải gắn với bảo vệ chủ quyền, quyền chủ quyền với biển đảo và vùng trời Tổ quốc","Việt Nam trở thành quốc gia mạnh về biển, làm giàu từ biển","Phát huy mạnh mẽ vai trò của biển đối với sự nghiệp xây dựng và bảo vệ Tổ Quốc","Tận dụng và khai thác tài nguyên biển tối đa để phát triển kinh tế xã hội"],"a":3,"g":0},{"n":329,"c":3,"q":"Trong chiến lược phát triển kinh tế - xã hội giai đoạn 2011 – 2020, Đảng đã xác định các bước đột phá có tính chiến lược, cụ thể:","o":["Tăng cường vai trò lãnh đạo của Đảng; Đẩy mạnh sự nghiệp công nghiệp hóa, hiện đại hóa; Phát huy vai trò của khối đại đoàn kết dân tôc","Nâng cao vai trò và sức chiến đấu của Đảng; Khơi dậy sức mạnh của khối đại đoàn kết toàn dân; Chủ động và tích cực hội nhập quốc tế","Xây dựng hệ thống kết cấu hạ tầng đồng bộ; Làm rõ hơn về thời kỳ quá độ lên CNXH; Khẳng định tính đúng đắn và nhất quán về sự lãnh đạo của Đảng","Hoàn thiện thể chế kinh tế thị trường định hướng xã hội chủ nghĩa; phát triển nhanh nguồn nhân lực, nhất là nguồn nhân lực chất lượng cao; xây dựng hệ thống kết cấu hạ tầng đồng bộ"],"a":3,"g":0},{"n":330,"c":3,"q":"Đại hội lần thứ IX (2001) đã xác định nội dung nào dưới đây:","o":["Cách mạng khoa học công nghệ, kinh tế tri thức, toàn cầu hóa diễn ra mạnh mẽ","Kinh tế tri thức, chuyển đổi số, cách mạng khoa học công nghệ đang phát triển","Công nghiệp hoá, hiện đại hoá, toàn cầu hoá đang diễn ra mạnh mẽ trên thế giới","Kinh tế tri thức, chuyển đổi số là nội dung trọng tâm, đẩy mạnh hàng đầu"],"a":0,"g":0},{"n":331,"c":3,"q":"Bài học kinh nghiệm về xây dựng hệ thống chính trị thời kỳ đổi mới được Đảng đưa ra tại Đại hội lần thứ VIII (1996) là:","o":["Kết hợp chặt chẽ ngay từ đầu đổi mới kinh tế với đổi mới chính trị","Đổi mới kinh tế là nhiệm vụ trọng tâm, cốt yếu cần đẩy mạnh","Kết hợp đẩy mạnh công nghiệp hoá, hiện đại hoá với giáo dục","Đổi mới kinh tế và đẩy mạnh ngoại giao là nhiệm vụ trung tâm"],"a":0,"g":0},{"n":332,"c":3,"q":"Đại hội Đại biểu toàn quốc lần thứ VIII (1996) đánh dấu bước ngoặt của Đảng trong chủ trương về:","o":["Đưa đất nước tiến thẳng lên chủ nghĩa xã hội","Đưa đất nước sang thời kỳ đẩy mạnh công nghiệp hóa, hiện đại hóa","Đổi mới kinh tế, tiến thẳng lên chủ nghĩa xã hội","Đẩy mạnh công nghiệp hóa, hiện đại hóa, đổi mới kinh tế"],"a":1,"g":0},{"n":333,"c":3,"q":"Đại hội X (2006) có bổ sung thêm hai đặc trưng mới của chủ nghĩa xã hội mà nhân dân ta xây dựng so với Cương lĩnh năm 1991, đó là:","o":["Dân giàu, nước mạnh, công bằng, dân chủ, văn minh; có Nhà nước pháp quyền xã hội chủ nghĩa của nhân dân, do nhân dân, vì nhân dân dưới sự lãnh đạo của Đảng Cộng sản","Có nền văn hoá tiên tiến, đậm đà bản sắc dân tộc; con người được giải phóng khỏi áp bức, bất công, có cuộc sống ấm no, tự do, hạnh phúc, phát triển toàn diện","Có Nhà nước pháp quyền xã hội chủ nghĩa của nhân dân, do nhân dân, vì nhân dân dưới sự lãnh đạo của Đảng Cộng sản; có quan hệ hữu nghị và hợp tác với nhân dân các nước trên thế giới","Do nhân dân lao động làm chủ; có nền kinh tế phát triển cao, dựa trên lực lượng sản xuất hiện đại và quan hệ sản xuất phù hợp với trình độ phát triển của lực lượng sản xuất"],"a":0,"g":0},{"n":334,"c":3,"q":"Bổ sung những cụm từ còn thiếu vào chỗ trống. Đại hội X (2006) của Đảng xác định quan điểm đối ngoại cần: “…………. và …………hội nhập kinh tế quốc tế, Việt nam là bạn, đối tác tin cậy của các nước trong cộng đồng quốc tế”","o":["chủ động/ tích cực","tăng cường/ đẩy mạnh","tích cực/ chủ động","đẩy mạnh/ tăng cường"],"a":0,"g":0},{"n":335,"c":3,"q":"Hội nghị Trung ương Đảng lần thứ 2 (4/1987) đã đề ra những chủ trương, biện pháp cấp bách về phân phối lưu thông, thực hiện bốn giảm, cụ thể:","o":["Giảm bội chi ngân sách, giảm nhịp độ tăng giá, giảm lạm phát, giảm thuế, kích thích sự lưu thông của hàng hóa","Giảm ngân sách, giảm nhịp độ tăng giá, giảm lạm phát, giảm xuất khẩu, tăng cường hoạt động xuất – nhập khẩu","Giảm bội chi ngân sách, giảm xuất khẩu, giảm lạm phát, giảm khó khăn về đời sống của nhân dân","Giảm bội chi ngân sách, giảm nhịp độ tăng giá, giảm lạm phát, giảm khó khăn về đời sống của nhân dân"],"a":3,"g":0},{"n":336,"c":3,"q":"Từ khi ra đời đến nay, Đảng Cộng sản Việt Nam đã ban hành bao nhiêu Cương lĩnh chính?","o":["3","4","5","6"],"a":1,"g":0}];
    const LETTERS = ["a", "b", "c", "d"];
    const app = document.getElementById("app");
    let S = null;

    // Theme management
    const savedTheme = localStorage.getItem("lsd-theme");
    if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);

    function toggleTheme() {
      const cur = document.documentElement.getAttribute("data-theme");
      const isDark = cur === "dark" || (!cur && window.matchMedia("(prefers-color-scheme: dark)").matches);
      const next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("lsd-theme", next);
      const btn = document.getElementById("theme-btn");
      if (btn) btn.textContent = next === "dark" ? "☀️ Sáng" : "🌙 Tối";
    }

    function themeBtnHtml() {
      const cur = document.documentElement.getAttribute("data-theme");
      const isDark = cur === "dark" || (!cur && window.matchMedia("(prefers-color-scheme: dark)").matches);
      return `<button class="icon-btn" id="theme-btn" type="button" title="Đổi giao diện sáng/tối">${isDark ? "☀️ Sáng" : "🌙 Tối"}</button>`;
    }

    const shuffle = a => {
      a = a.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    };

    const esc = s => String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    const total = c => DATA.filter(q => c === "0" || String(q.c) === c).length;

    function home() {
      if (S && S.tid) clearInterval(S.tid);
      S = null;
      app.innerHTML = `
        <header class="app-header">
          <div>
            <h1>Ôn tập Lịch sử Đảng Cộng sản Việt Nam</h1>
            <p class="sub">Ngân hàng ${DATA.length} câu hỏi trắc nghiệm · Hỗ trợ phím tắt Numpad 1–4 &amp; Enter</p>
          </div>
          <div class="header-actions">${themeBtnHtml()}</div>
        </header>

        <div class="card">
          <div class="form-grid">
            <label class="f">Phạm vi ôn tập
              <select id="ch">
                <option value="0">Tất cả các chương (${total("0")} câu)</option>
                <option value="1">Chương I (${total("1")} câu)</option>
                <option value="2">Chương II (${total("2")} câu)</option>
                <option value="3">Chương III (${total("3")} câu)</option>
              </select>
            </label>
            <label class="f">Số lượng câu
              <input id="num" type="number" min="1" max="${DATA.length}" value="${DATA.length}">
            </label>
          </div>

          <label class="f">Chế độ làm bài
            <select id="mode">
              <option value="r">Ôn tập: kiểm tra đáp án ngay sau mỗi câu</option>
              <option value="t">Kiểm tra: chỉ chấm điểm khi nộp bài</option>
            </select>
          </label>

          <div class="options-group">
            <label class="chk" for="sq">
              <input id="sq" type="checkbox" checked>
              <span>Trộn thứ tự câu hỏi</span>
            </label>
            <label class="chk" for="so">
              <input id="so" type="checkbox">
              <span>Trộn thứ tự đáp án (A, B, C, D)</span>
            </label>
            <label class="chk" for="rt">
              <input id="rt" type="checkbox">
              <span>Cho thử lại nếu chọn sai (chế độ Ôn tập, sai lần đầu vẫn tính sai)</span>
            </label>
            <div class="chk">
              <input id="au" type="checkbox">
              <label for="au">Tự động hiện đáp án sau</label>
              <input id="sec" type="number" min="1" value="10">
              <span>giây (chế độ Ôn tập)</span>
            </div>
          </div>

          <div class="row">
            <button class="btn p" id="go" type="button">Bắt đầu làm bài <kbd>Enter</kbd></button>
          </div>

          <div class="shortcut-bar">
            <span class="shortcut-item"><kbd>Numpad 1</kbd>–<kbd>4</kbd> hoặc <kbd>1</kbd>–<kbd>4</kbd> Chọn đáp án</span>
            <span class="shortcut-item"><kbd>Enter</kbd> Kiểm tra / Câu tiếp</span>
            <span class="shortcut-item"><kbd>←</kbd> <kbd>→</kbd> Chuyển câu</span>
          </div>
        </div>
      `;

      document.getElementById("theme-btn").onclick = toggleTheme;
      const ch = document.getElementById("ch");
      const num = document.getElementById("num");
      ch.onchange = () => {
        const maxQ = total(ch.value);
        num.max = maxQ;
        num.value = maxQ;
      };

      document.getElementById("go").onclick = () => {
        let pool = DATA.filter(q => ch.value === "0" || String(q.c) === ch.value);
        if (document.getElementById("sq").checked) pool = shuffle(pool);
        const n = Math.max(1, Math.min(pool.length, parseInt(num.value, 10) || pool.length));
        start(
          pool.slice(0, n),
          document.getElementById("mode").value,
          document.getElementById("so").checked,
          {
            retry: document.getElementById("rt").checked,
            auto: document.getElementById("au").checked,
            secs: Math.max(1, parseInt(document.getElementById("sec").value, 10) || 10)
          }
        );
      };
    }

    function start(pool, mode, so, opt) {
      const qs = pool.map(q => {
        const ord = so ? shuffle([0, 1, 2, 3]) : [0, 1, 2, 3];
        return {
          n: q.n,
          c: q.c,
          q: q.q,
          g: q.g,
          o: ord.map(i => q.o[i]),
          a: ord.indexOf(q.a),
          sel: null,   // Đáp án đang chọn tạm (chưa kiểm tra trong chế độ Ôn tập)
          pick: null,  // Đáp án đã chốt / kiểm tra
          rev: false,
          tried: []
        };
      });
      S = {
        qs,
        mode,
        i: 0,
        retry: opt.retry,
        auto: opt.auto,
        secs: opt.secs,
        view: "q",
        tq: -1,
        left: 0,
        tid: null
      };
      draw();
    }

    const isLocked = q => S.mode === "r" && (q.rev || q.pick !== null);

    function status(q) {
      if (S.mode === "r") {
        if (isLocked(q)) return q.pick === q.a && !q.tried.length ? "ok" : "no";
        return q.tried.length ? "no" : (q.sel !== null ? "done" : "");
      }
      return q.pick === null ? "" : "done";
    }

    function evaluateSelection(q, k) {
      if (S.mode === "r") {
        if (S.retry && k !== q.a) {
          if (!q.tried.includes(k)) q.tried.push(k);
          q.sel = null;
        } else {
          q.pick = k;
          q.sel = k;
        }
      } else {
        q.pick = k;
        q.sel = k;
      }
      draw();
    }

    function draw() {
      clearInterval(S.tid);
      const q = S.qs[S.i];
      const n = S.qs.length;
      const answered = S.qs.filter(x => x.pick !== null || x.rev).length;
      const locked = isLocked(q);
      const timed = S.mode === "r" && S.auto && !locked;

      if (timed && S.tq !== S.i) {
        S.tq = S.i;
        S.left = S.secs;
      }

      let h = `
        <header class="app-header">
          <div>
            <h1>Ôn tập Lịch sử Đảng</h1>
            <p class="sub">${S.mode === "r" ? "Chế độ Ôn tập" : "Chế độ Kiểm tra"} · Chương ${q.c}</p>
          </div>
          <div class="header-actions">
            ${themeBtnHtml()}
            <button class="icon-btn" id="exit-btn" type="button" title="Thoát về trang chọn đề">✕ Thoát</button>
          </div>
        </header>

        <div class="top">
          <span class="badge">Câu ${S.i + 1} / ${n} · Đề gốc #${q.n}</span>
          <span>Đã hoàn thành: <b>${answered}/${n}</b></span>
        </div>
        <div class="bar"><i style="width:${(answered / n) * 100}%"></i></div>

        <div class="card" id="q-card">
          <p class="q">${esc(q.q)}</p>
      `;

      q.o.forEach((t, k) => {
        let cls = "opt";
        const isEliminated = !locked && S.mode === "r" && q.tried.includes(k);

        if (locked) {
          if (k === q.a) cls += " ok";
          else if (k === q.pick) cls += " no";
        } else if (isEliminated) {
          cls += " no";
        } else if ((S.mode === "r" && q.sel === k) || (S.mode === "t" && q.pick === k)) {
          cls += " sel";
        }

        h += `
          <button class="${cls}" data-k="${k}" type="button" ${locked || isEliminated ? "disabled" : ""}>
            <span class="opt-letter">${LETTERS[k]}</span>
            <span class="opt-text">${esc(t)}</span>
            <kbd>${k + 1}</kbd>
          </button>
        `;
      });

      if (locked) {
        if (q.pick === q.a) {
          h += `<p class="fb ok">✓ Chính xác!</p>`;
        } else if (q.pick === null) {
          h += `<p class="fb no">⏰ Hết giờ. Đáp án đúng là <b>${LETTERS[q.a].toUpperCase()}</b>.</p>`;
        } else {
          h += `<p class="fb no">✕ Chưa đúng. Đáp án đúng là <b>${LETTERS[q.a].toUpperCase()}</b>.</p>`;
        }
        if (q.g) {
          h += `<p class="fb">Lưu ý: file gốc không đánh dấu đáp án cho câu này, đáp án trên là suy luận tham khảo, nên đối chiếu lại giáo trình.</p>`;
        }
      } else {
        if (S.mode === "r" && q.tried.length) {
          h += `<p class="fb no">Chưa đúng, hãy chọn đáp án khác và bấm Enter để thử lại.</p>`;
        }
        if (timed) {
          h += `<p class="fb" id="cd">Đáp án sẽ tự hiện sau <b>${S.left}</b> giây</p>`;
        }
      }

      h += `
          <div class="row">
            <button class="btn" id="pv" type="button" ${S.i === 0 ? "disabled" : ""}>← Câu trước</button>
            ${S.mode === "r" && !locked
              ? `<button class="btn check-btn" id="chk-btn" type="button" ${q.sel === null ? "disabled" : ""}>Kiểm tra <kbd>Enter</kbd></button>`
              : ""
            }
            <button class="btn ${locked ? "p" : ""}" id="nx" type="button" ${S.i === n - 1 ? "disabled" : ""}>
              Câu sau → ${locked && S.i < n - 1 ? "<kbd>Enter</kbd>" : ""}
            </button>
            <span class="spacer"></span>
            <button class="btn p" id="fin" type="button">Nộp bài</button>
          </div>

          <div class="shortcut-bar">
            <span class="shortcut-item"><kbd>Numpad 1</kbd>–<kbd>4</kbd> hoặc <kbd>1</kbd>–<kbd>4</kbd> Chọn đáp án</span>
            <span class="shortcut-item"><kbd>Enter</kbd> ${S.mode === "r" ? (locked ? "Câu tiếp theo" : "Kiểm tra đáp án") : "Câu tiếp theo"}</span>
            <span class="shortcut-item"><kbd>←</kbd> <kbd>→</kbd> Chuyển câu</span>
          </div>
        </div>

        <div class="card">
          <div class="top">
            <span><b>Danh sách câu hỏi</b></span>
            <div class="nav-legend">
              <span><i class="dot ok"></i>Đúng</span>
              <span><i class="dot no"></i>Sai</span>
              <span><i class="dot done"></i>Đã chọn</span>
            </div>
          </div>
          <div class="nav">
      `;

      S.qs.forEach((x, k) => {
        h += `<button class="${status(x)}${k === S.i ? " cur" : ""}" data-j="${k}" type="button">${k + 1}</button>`;
      });

      h += `</div></div>`;
      app.innerHTML = h;

      document.getElementById("theme-btn").onclick = toggleTheme;
      document.getElementById("exit-btn").onclick = () => {
        if (confirm("Quay về trang chính? Tiến trình làm bài hiện tại sẽ không được lưu.")) home();
      };

      // Click on option: in Review mode, clicking directly evaluates (fast for mouse),
      // while keyboard 1-4 selects (q.sel) and Enter evaluates!
      app.querySelectorAll(".opt").forEach(b => {
        b.onclick = () => {
          if (locked) return;
          const k = +b.dataset.k;
          evaluateSelection(q, k);
        };
      });

      const chkBtn = document.getElementById("chk-btn");
      if (chkBtn) {
        chkBtn.onclick = () => {
          if (!locked && q.sel !== null) evaluateSelection(q, q.sel);
        };
      }

      app.querySelectorAll(".nav button").forEach(b => {
        b.onclick = () => {
          S.i = +b.dataset.j;
          draw();
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
      });

      if (timed) {
        S.tid = setInterval(() => {
          S.left--;
          if (S.left <= 0) {
            clearInterval(S.tid);
            q.rev = true;
            draw();
            return;
          }
          const el = document.getElementById("cd");
          if (el) el.innerHTML = `Đáp án sẽ tự hiện sau <b>${S.left}</b> giây`;
        }, 1000);
      }

      document.getElementById("pv").onclick = () => {
        if (S.i > 0) {
          S.i--;
          draw();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      };

      document.getElementById("nx").onclick = () => {
        if (S.i < n - 1) {
          S.i++;
          draw();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      };

      document.getElementById("fin").onclick = () => {
        const left = S.qs.length - S.qs.filter(x => x.pick !== null).length;
        if (left && !confirm(`Còn ${left} câu chưa trả lời. Bạn vẫn muốn nộp bài?`)) return;
        result();
      };
    }

    function result() {
      clearInterval(S.tid);
      S.view = "r";
      const n = S.qs.length;
      const right = S.qs.filter(q => q.pick === q.a && !q.tried.length).length;
      const wrong = S.qs.filter(q => !(q.pick === q.a && !q.tried.length));
      const pct = Math.round((right / n) * 100);

      let h = `
        <header class="app-header">
          <div>
            <h1>Kết quả bài làm</h1>
            <p class="sub">Hoàn thành ${n} câu hỏi trắc nghiệm</p>
          </div>
          <div class="header-actions">${themeBtnHtml()}</div>
        </header>

        <div class="card">
          <div class="stats-grid">
            <div class="stat-box ok">
              <div class="val">${right}/${n}</div>
              <div class="lbl">Số câu trả lời đúng</div>
            </div>
            <div class="stat-box no">
              <div class="val">${wrong.length}</div>
              <div class="lbl">Số câu sai / bỏ trống</div>
            </div>
            <div class="stat-box">
              <div class="val">${pct}%</div>
              <div class="lbl">Tỷ lệ chính xác</div>
            </div>
          </div>

          <div class="row">
            <button class="btn p" id="again" type="button">Làm lại ${wrong.length} câu sai</button>
            <button class="btn" id="home" type="button">Về trang đầu</button>
          </div>
        </div>
      `;

      if (wrong.length) {
        h += `<div class="card"><div class="top"><span><b>Chi tiết các câu cần xem lại (${wrong.length} câu)</b></span></div>`;
        wrong.forEach(q => {
          const chosenIdx = q.tried.length ? q.tried[0] : q.pick;
          const chosenText = chosenIdx === null
            ? "Chưa trả lời"
            : `${LETTERS[chosenIdx].toUpperCase()}. ${esc(q.o[chosenIdx])}`;
          h += `
            <div class="wr">
              <p><b>Câu ${q.n} (Chương ${q.c}):</b> ${esc(q.q)}</p>
              <p class="fb no">Bạn chọn: ${chosenText}</p>
              <p class="fb ok">Đáp án đúng: ${LETTERS[q.a].toUpperCase()}. ${esc(q.o[q.a])}</p>
            </div>
          `;
        });
        h += `</div>`;
      }

      app.innerHTML = h;
      window.scrollTo({ top: 0, behavior: "smooth" });
      document.getElementById("theme-btn").onclick = toggleTheme;
      document.getElementById("home").onclick = home;

      const ag = document.getElementById("again");
      if (!wrong.length) ag.classList.add("hid");
      ag.onclick = () => {
        S = {
          qs: wrong.map(q => ({
            n: q.n,
            c: q.c,
            q: q.q,
            g: q.g,
            o: q.o,
            a: q.a,
            sel: null,
            pick: null,
            rev: false,
            tried: []
          })),
          mode: S.mode,
          i: 0,
          retry: S.retry,
          auto: S.auto,
          secs: S.secs,
          view: "q",
          tq: -1,
          left: 0,
          tid: null
        };
        draw();
      };
    }

    // Keyboard shortcuts:
    // - Numpad 1-4 (with NumLock ON) or Digit 1-4: select option A-D
    // - Enter / NumpadEnter: check answer (in Review mode) or advance to next question
    // - ArrowLeft / ArrowRight: navigate questions
    document.addEventListener("keydown", e => {
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;

      // Home screen: Enter starts the quiz
      if (!S) {
        if (e.key === "Enter" || e.code === "NumpadEnter") {
          const goBtn = document.getElementById("go");
          if (goBtn) {
            e.preventDefault();
            goBtn.click();
          }
        }
        return;
      }

      if (S.view !== "q") return;

      const q = S.qs[S.i];
      const locked = isLocked(q);

      // Map 1-4 and Numpad 1-4 (when NumLock is active, e.key is '1'-'4' and e.code is 'Numpad1'-'Numpad4')
      let optIndex = -1;
      if (e.key >= "1" && e.key <= "4") {
        optIndex = Number(e.key) - 1;
      } else if (e.code === "Numpad1" || e.code === "Digit1") {
        optIndex = 0;
      } else if (e.code === "Numpad2" || e.code === "Digit2") {
        optIndex = 1;
      } else if (e.code === "Numpad3" || e.code === "Digit3") {
        optIndex = 2;
      } else if (e.code === "Numpad4" || e.code === "Digit4") {
        optIndex = 3;
      }

      if (optIndex !== -1) {
        e.preventDefault();
        if (locked) return;
        if (S.mode === "r" && q.tried.includes(optIndex)) return;
        if (S.mode === "r") {
          q.sel = optIndex;
        } else {
          q.pick = optIndex;
          q.sel = optIndex;
        }
        draw();
        return;
      }

      // Enter / NumpadEnter: Check answer or move next
      if (e.key === "Enter" || e.code === "NumpadEnter") {
        e.preventDefault();
        if (S.mode === "r" && !locked) {
          if (q.sel !== null) {
            evaluateSelection(q, q.sel);
          } else {
            const card = document.getElementById("q-card");
            if (card) {
              card.classList.remove("shake");
              void card.offsetWidth;
              card.classList.add("shake");
            }
          }
          return;
        }

        // Already locked (in Review mode) or in Test mode -> move to next question or submit
        if (S.i < S.qs.length - 1) {
          S.i++;
          draw();
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else {
          const finBtn = document.getElementById("fin");
          if (finBtn) finBtn.click();
        }
        return;
      }

      if (e.key === "ArrowRight" && S.i < S.qs.length - 1) {
        e.preventDefault();
        S.i++;
        draw();
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else if (e.key === "ArrowLeft" && S.i > 0) {
        e.preventDefault();
        S.i--;
        draw();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    home();
  </script>
</body>
</html>
